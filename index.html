<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daryn Cup — Квиз</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E1A5B;--navy2:#1B2D8F;--yellow:#FFD23F;--coral:#FF5A4E;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--navy);color:var(--white);font-family:'Montserrat',sans-serif;padding:24px 16px 40px}
.wrap{max-width:900px;margin:0 auto}
h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(32px,7vw,64px);margin:0;line-height:1}
h1 span{color:var(--yellow)}
.sub{margin:10px 0 24px;font-weight:700;font-size:clamp(14px,2.5vw,20px)}
.board{display:grid;grid-template-columns:minmax(90px,1.4fr) repeat(3,1fr);gap:10px}
.head{font-family:'Unbounded',sans-serif;font-weight:700;text-align:center;color:var(--yellow);font-size:clamp(14px,3vw,24px);padding:8px 0}
.topic{display:flex;align-items:center;background:var(--navy2);border:3px solid var(--yellow);border-radius:14px;padding:8px 12px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(13px,2.6vw,22px)}
.cell{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(20px,5vw,40px);min-height:84px;border:0;border-radius:14px;cursor:pointer;color:var(--navy);background:var(--white);transition:transform .15s}
.cell:hover,.cell:focus-visible{transform:scale(1.05);outline:3px solid var(--coral)}
.cell.p10{background:var(--yellow)}
.cell.p15{background:var(--coral)}
.cell.used{background:var(--navy2);color:#8fa0ff;cursor:default;transform:none;outline:none;text-decoration:line-through}
.reset{margin-top:24px;background:transparent;color:var(--white);border:2px solid var(--white);border-radius:999px;padding:10px 20px;font:700 14px 'Montserrat',sans-serif;cursor:pointer}
.reset:hover{background:var(--white);color:var(--navy)}
.overlay{position:fixed;inset:0;background:rgba(5,10,40,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--white);color:var(--navy);border-radius:22px;max-width:680px;width:100%;padding:28px;display:flex;flex-direction:column;gap:18px;max-height:92vh;overflow:auto}
.tag{align-self:flex-start;background:var(--yellow);font-weight:800;letter-spacing:2px;font-size:13px;padding:8px 14px;border-radius:999px}
.q{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(18px,3.4vw,26px);line-height:1.3;margin:0}
.ans{display:none;background:var(--navy);color:var(--yellow);border-radius:14px;padding:16px;font-weight:700;font-size:clamp(16px,2.6vw,20px);line-height:1.4}
.ans.show{display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 22px;font:800 15px 'Montserrat',sans-serif;cursor:pointer}
.btn.show{background:var(--coral);color:var(--navy)}
.btn.close{background:var(--navy);color:var(--white)}
</style>
</head>
<body>
<div class="wrap">
  <h1>DARYN <span>CUP</span></h1>
  <div class="sub">Кім кімнен дарынды? Ұяшықты бас та, сұраққа жауап бер!</div>
  <div class="board" id="board"></div>
  <button class="reset" id="reset" type="button">Ойынды басынан бастау</button>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="q">
  <div class="modal">
    <div class="tag" id="tag"></div>
    <p class="q" id="q"></p>
    <div class="ans" id="ans"></div>
    <div class="btns">
      <button class="btn show" id="showBtn" type="button">Жауабын көрсету</button>
      <button class="btn close" id="closeBtn" type="button">Жабу</button>
    </div>
  </div>
</div>

<script>
// Сұрақтарды осы жерден өзгертуге болады: [сұрақ, жауап] — 5, 10, 15 балл ретімен
const DATA = [
  {topic:"Тарих", items:[
    ["1723–1727 жылдардағы қазақ халқының ауыр қасіретін «Ақтабан шұбырынды, Алқакөл сұлама» дейді. Бұл қасіретке қай жау басқыншылығы себеп болды?","Жоңғар шапқыншылығы"],
    ["1219 жылы Отырар қаласының билеушісі Шыңғыс ханның керуенін тонады. Бұл оқиға Шыңғыс хан жорығына сылтау болды. Сол билеушінің аты кім?","Ыналшық, Қайыр хан"],
    ["1916 жылғы ұлт-азаттық көтерілістің Торғай даласындағы басты қолбасшысы кім?","Амангелді Иманов"]
  ]},
  {topic:"Әлем", items:[
    ["Дүние жүзіндегі ең терең көл қайсы? ","Байкал, шамамен 1640 м"],
    ["Әлемде «екі рет тұйық» (теңізге шыға алмайтын елдермен ғана шектесетін) тек екі мемлекет бар. Бірі Лихтенштейн. Екінші ел?","Өзбекстан"],
    ["Теңіз асты аумақтарын қоса есептегенде, әлемдегі ең көп уақыт белдеуі бар ел қайсы?","Франция, 12–13 белдеу"]
  ]},
  {topic:"Әдебиет", items:[
    ["Ақан серінің аты аңызға айналған тұлпары Құлагер сайыста  өледі. Осы трагедияны жырлаған «Құлагер» поэмасының авторы кім?","Ілияс Жансүгіров"],
    ["1927 жылы жарық көрген, қазақтың тұңғыш психологиялық романы деп аталатын шығарма қайсы? Кейіпкері ескі салт пен жаңа заманның арасында қалған қыз. ","Жүсіпбек Аймауытов романы «Ақбілек»"],
    ["Абайдың өмірі мен заманын көрсететін «Абай жолы» эпопеясы үшін Мұхтар Әуезов қай жылы КСРО-ның Лениндік сыйлығын алды?","1959 жыл"]
  ]},
  {topic:"Тұлға", items:[
    ["1858 жылы Шоқан Уәлиханов Қашғарияға (қазіргі Қытайдың батысы) өте қауіпті жасырын сапарға шықты. Ол ол жаққа ғалым не офицер ретінде бармады, басқа адамның кейпіне енді. Шоқан кім болып барды?","Саудагер болып, Әлімбай деген атпен. Оның осылай жасауының себебі: Қашғарияға еуропалықтар мен орыс офицерлерін кіргізбейтін еді"],
    ["Бұл адам әрі хан, әрі ғалым болды. Ол Самарқандта сол заманның ең үлкен обсерваториясын салдырып, мыңнан астам жұлдыздың орнын дәл өлшеп, жұлдыздар каталогін жасады. Оның атасы — Әмір Темір. Бұл ғалым-билеуші кім?","Ұлықбек"],
    ["Леонардо да Винчи «Мона Лиза» суретін салған. Сонымен бірге ол парашют, тікұшақ және танк сияқты құрылғылардың сызбасын жасаған. Оның күнделік жазбаларын оқу қиын, өйткені ол өте ерекше тәсілмен жазған. Ол қалай жазған?","Айна бейнесімен: әріптер оңнан солға қарай, айнаға қараған кезде ғана оқылатындай етіп жазылған"]
  ]},
  {topic:"Мәдениет", items:[
    ["Қырғыз халқының «Иллиада» мен «Одиссеяны» қосқаннан шамамен 20 есе ұзын эпосы бар. Оны жазбай, жатқа айтады. Бұл эпостың атауы қандай? Оны жатқа айтатын жыршылар қалай аталады?","«Манас»; манасшылар"],
    ["Бір Еуропа елінде адамдар «иә» дегенде басын шайқайды, ал «жоқ» дегенде изейді, яғни біздікіне кері. Саяхатшылар бұл елде жиі шатасып қалады. Бұл қай ел?","Болгария"]
    ,
    ["Бір Еуропа елінде қайтыс болған адамдарды жерлеуге тыйым салынған. Бұл қай ел? Және не себепті?","Норвегия, мәңгі салқында дене шірімейді, бұл ақ аюларды шақыруы мүмкін"]
  ]}
];
const POINTS=[5,10,15];
const KEY="daryn-quiz-used";
let used={};
try{used=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(used))}catch(e){}}

const board=document.getElementById("board");
const overlay=document.getElementById("overlay");
const tag=document.getElementById("tag"),q=document.getElementById("q"),ans=document.getElementById("ans");
const showBtn=document.getElementById("showBtn");

function build(){
  board.innerHTML="";
  board.appendChild(document.createElement("div"));
  POINTS.forEach(p=>{const h=document.createElement("div");h.className="head";h.textContent=p+" балл";board.appendChild(h)});
  DATA.forEach((row,r)=>{
    const t=document.createElement("div");t.className="topic";t.textContent=row.topic;board.appendChild(t);
    row.items.forEach((it,c)=>{
      const id=r+"-"+c;
      const b=document.createElement("button");
      b.type="button";b.className="cell p"+POINTS[c]+(used[id]?" used":"");
      b.textContent=POINTS[c];
      b.setAttribute("aria-label",row.topic+", "+POINTS[c]+" балл");
      b.addEventListener("click",()=>openQ(r,c,b));
      board.appendChild(b);
    });
  });
}
function openQ(r,c,btn){
  const it=DATA[r].items[c];
  tag.textContent=DATA[r].topic.toUpperCase()+" · "+POINTS[c]+" БАЛЛ";
  q.textContent=it[0];ans.textContent=it[1];
  ans.classList.remove("show");showBtn.style.display="";
  overlay.classList.add("open");
  used[r+"-"+c]=true;save();btn.classList.add("used");
}
function closeQ(){overlay.classList.remove("open")}
showBtn.addEventListener("click",()=>{ans.classList.add("show");showBtn.style.display="none"});
document.getElementById("closeBtn").addEventListener("click",closeQ);
overlay.addEventListener("click",e=>{if(e.target===overlay)closeQ()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeQ()});
document.getElementById("reset").addEventListener("click",()=>{used={};save();build()});
build();
</script>
</body>
</html>
